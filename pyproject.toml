[project]
name = "opspilot"
version = "0.1.0"
description = "OpsPilot: AI operations assistant for Northwind Supply GmbH"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "reportlab>=5.1.0",
  "faker>=40.54.0",
  "langgraph>=1.2.23",
  "langgraph-checkpoint-postgres>=3.2.1",
  "psycopg-pool>=3.3.3",
  "openai>=3.55.1",
  "pypdf>=7.1.1",
  "python-multipart>=0.0.34",
  "streamlit>=1.67.0",
  "plotly>=7.1.0",
  "httpx>=0.28.1",
  "pandas>=3.1.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pgserver>=0.1.4",
  "types-reportlab>=5.1.0.20261104",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # formatter owns line length

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src/opspilot --cov-report=term-missing"
markers = ["integration: needs a real Postgres (docker compose up postgres)"]

[tool.coverage.report]
fail_under = 85

