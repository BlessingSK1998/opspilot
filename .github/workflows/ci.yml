name: ci
on: [push, pull_request]
defaults:
  run:
    working-directory: apps/opspilot
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      # Integration tests use embedded Postgres (pgserver).
      - name: Offline eval (fails if mock-mode quality drops)
        run: uv run python -m opspilot.eval.run --provider mock --out /tmp/eval --min-accuracy 0.90 --min-escalation-recall 0.95
      - name: Offline eval, personal profile
        run: uv run python -m opspilot.eval.run --provider mock --dataset personal --out /tmp/eval-personal --min-accuracy 0.90 --min-escalation-recall 0.95
