name: ci
on: [push, pull_request]
defaults:
  run:
    working-directory: apps/opspilot
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      # Integration tests use embedded Postgres (pgserver). Eval gate arrives in M8.
